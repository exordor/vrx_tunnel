launch:
  world: water_only
  sim_mode: full
  headless: false
  paused: false
  extra_gz_args: ""
  rviz:
    enable: true

model_name: wamv
model_type: wam-v
urdf: tmp/wamv_rgl_mini.urdf
scale:
  hull_length: 0.72
  hull_width: 0.80
  hull_height: 0.44
position:
  xyz: [-1.0, 0.0, 0.0]
  rpy: [0.0, 0.0, 0.0]

joy_teleop:
  ros__parameters:

    left_thrust:
      type: topic
      interface_type: std_msgs/msg/Float64
      topic_name: /wamv/thrusters/left/thrust
      deadman_buttons: [4]
      axis_mappings:
        data:
          axis: 1
          scale: 1000.0
          offset: 0

    right_thrust:
      type: topic
      interface_type: std_msgs/msg/Float64
      topic_name: /wamv/thrusters/right/thrust
      deadman_buttons: [4]
      axis_mappings:
        data:
          axis: 3
          scale: 1000.0
          offset: 0

    left_pos:
      type: topic
      interface_type: std_msgs/msg/Float64
      topic_name: /wamv/thrusters/left/pos
      deadman_buttons: [4]
      axis_mappings:
        data:
          axis: 0
          scale: -1.0
          offset: 0

    right_pos:
      type: topic
      interface_type: std_msgs/msg/Float64
      topic_name: /wamv/thrusters/right/pos
      deadman_buttons: [4]
      axis_mappings:
        data:
          axis: 2
          scale: -1.0
          offset: 0

    ball_shooter:
      type: topic
      interface_type: std_msgs/msg/Bool
      topic_name: /wamv/shooters/ball_shooter/fire
      deadman_buttons: [1]
      message_value:
        data:
          value: true

# Optional: auto-forward controller settings used by tunnel_viz.launch.py
auto_forward:
  enable: true
  thrust: 40.0
  bias: 0.0
  rate: 20.0
  duration: 100.0
  start_delay: 25.0

# Optional: rosbag recording configuration
rosbag:
  enable: true
  format: mcap
  start_delay: 0.0
  topics:
    - /clock
    - /wamv/sensors/imu/data
    - /wamv/scan_front
    - /wamv/scan_omni
    - /tf
    - /tf_static
